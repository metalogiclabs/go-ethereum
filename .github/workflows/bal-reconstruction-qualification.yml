name: BAL Reconstruction Qualification

on:
  push:
    branches:
      - bal-reconstruction-qualification-v1
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Run BAL reconstruction differential oracles
        run: go test ./core -run '^TestBALReconstruction.*Differential$' -count=1
