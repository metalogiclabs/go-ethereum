name: BAL Finality Ancestry Probe

on:
  push:
    branches:
      - bal-finality-ancestry-probe-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Fetch exact upstream reconstruction candidate
        run: |
          git fetch --no-tags --depth=1 https://github.com/ethereum/go-ethereum.git 6e58478e99c3204f447817cac31e595c51b7d7f4
          git worktree add --detach ../reconstruction-candidate FETCH_HEAD
          cp core/bal_finality_ancestry_probe_test.go ../reconstruction-candidate/core/
          cd ../reconstruction-candidate
          test "$(git rev-parse HEAD)" = 6e58478e99c3204f447817cac31e595c51b7d7f4
          gofmt -d core/bal_finality_ancestry_probe_test.go | tee /tmp/bal-finality-format.diff
          test ! -s /tmp/bal-finality-format.diff
      - name: Verify finalized anchor eligible and fork ineligible
        run: |
          cd ../reconstruction-candidate
          set +e
          go test ./core -run '^TestBALReconstructionFinalityAncestry$' -count=1 -v >/tmp/finality.log 2>&1
          code=$?
          set -e
          cat /tmp/finality.log
          if [ "$code" -eq 0 ]; then
            echo 'Finality ancestry guard already works: proposal rejected' >&2
            exit 1
          fi
          grep -q -- '--- FAIL: TestBALReconstructionFinalityAncestry' /tmp/finality.log
          grep -q 'non-finalized sibling treated as finalized' /tmp/finality.log
      - name: Verify competing block is not executionlessly imported
        run: |
          cd ../reconstruction-candidate
          set +e
          go test ./core -run '^TestBALReconstructionFinalityForkImport$' -count=1 -v >/tmp/fork-import.log 2>&1
          code=$?
          set -e
          cat /tmp/fork-import.log
          if [ "$code" -eq 0 ]; then
            echo 'Full import path correctly executes competing block' >&2
            exit 1
          fi
          grep -q -- '--- FAIL: TestBALReconstructionFinalityForkImport' /tmp/fork-import.log
          grep -q 'unfinalized competing block bypassed execution' /tmp/fork-import.log
      - name: Test minimal fail-closed finality ancestry guard
        run: |
          cd ../reconstruction-candidate
          python3 - <<'PY'
          from pathlib import Path
          p = Path("core/bal_apply.go")
          code = p.read_text()
          old = "\tfinal := bc.CurrentFinalBlock()\n\treturn final != nil && block.NumberU64() <= final.Number.Uint64()"
          new = """\tfinal := bc.CurrentFinalBlock()
          \tif final == nil || block.NumberU64() > final.Number.Uint64() {
          \t\treturn false
          \t}
          \tif block.NumberU64() == final.Number.Uint64() {
          \t\treturn block.Hash() == final.Hash()
          \t}
          \t// Fail closed if no authenticated header ancestry is available.
          \tgap := final.Number.Uint64() - block.NumberU64()
          \tmaxNonCanonical := gap
          \tancestor, number := bc.hc.GetAncestor(final.Hash(), final.Number.Uint64(), gap, &maxNonCanonical)
          \treturn number == block.NumberU64() && ancestor == block.Hash()"""
          assert code.count(old) == 1, "guard splice location changed"
          p.write_text(code.replace(old, new))
          PY
          gofmt -w core/bal_apply.go
          go test ./core -run '^TestBALReconstructionFinality(Ancestry|ForkImport)$' -count=1 -v
          go test ./core -run '^TestInsertChainReconstructsFinalizedState$' -count=1 -v
