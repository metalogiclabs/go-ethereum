name: BAL Finality Skeleton Integration Qualification

on:
  push:
    branches:
      - bal-finality-skeleton-probe-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Check Go formatting
        run: |
          gofmt -d core/bal_apply.go core/bal_finality_skeleton_test.go core/bal_finality_ancestry_test.go core/bal_apply_test.go | tee /tmp/gofmt-diff
          test ! -s /tmp/gofmt-diff
      - name: Check skeleton finality and competing fork regressions
        run: |
          go test ./core -run '^(TestBALReconstructionFromSkeletonHeaders|TestBALReconstructionRejectsBrokenSkeletonChain|TestBALReconstructionFinalityAncestry|TestBALReconstructionFinalityForkImport|TestInsertChainReconstructsFinalizedState)$' -count=1 -v
      - name: Full core suite
        run: go test ./core -count=1
      - name: Isolated skeleton ancestry scan benchmark
        run: go test ./core -run '^$' -bench '^BenchmarkSkeletonFinalityScan$' -benchtime=3x -count=1 -benchmem
