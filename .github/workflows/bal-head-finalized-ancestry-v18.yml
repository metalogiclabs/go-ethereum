name: BAL V18 Conflicting Fork Ancestry (Fork Only)
on:
  push:
    branches: [bal-head-finalized-ancestry-v18]
  pull_request:
    branches: [bal-validation-before-authority-v17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin official source
        run: |
          set -euo pipefail
          git config user.name "Metalogic CI"
          git config user.email "ci@mathgraph.org"
          git fetch --no-tags https://github.com/ethereum/go-ethereum.git 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c
          git merge --no-edit FETCH_HEAD
          echo "MG_V18_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Negative fork ancestry and original regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v18"
          gofmt -d eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_head_finalized_ancestry_v18_test.go | tee "$RUNNER_TEMP/v18/gofmt.diff"
          test ! -s "$RUNNER_TEMP/v18/gofmt.diff"
          sha256sum eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_head_finalized_ancestry_v18_test.go | tee "$RUNNER_TEMP/v18/source.sha256"
          go test -tags balexperiment ./eth/catalyst -run '^TestBALV18CompetingForkFinalityFailsClosed$' -count=3 -v -timeout=15m | tee "$RUNNER_TEMP/v18/fork.log"
          test "$(grep -c 'MG_BAL_V18_VERDICT CROSS_FORK_FINALITY_REJECTED_EXACT_HASH_ANCESTRY' "$RUNNER_TEMP/v18/fork.log")" -eq 3
          go test -tags balexperiment ./core -run '^(TestBALPendingFinalityV15FenceRejectsRevokedAndABAPermits|TestBALPendingFinalityV15CommitFenceSerializesRevocation)$' -count=1 -timeout=15m
          go test -tags balexperiment ./eth/catalyst -run '^(TestBALInvalidFCUV17MalformedAttributesCannotAdmitPendingAuthority|TestBALEngineV13VolatilePendingWitness)$' -count=1 -v -timeout=30m | tee "$RUNNER_TEMP/v18/engine.log"
          test "$(grep -c 'MG_BAL_ENGINE_V13_ARM' "$RUNNER_TEMP/v18/engine.log")" -eq 2
          test "$(grep -c 'MG_BAL_V17_ARM' "$RUNNER_TEMP/v18/engine.log")" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bal-v18-conflicting-fork-evidence
          path: ${{ runner.temp }}/v18/
          if-no-files-found: ignore
