name: MathGraph No Import Single ERA Read Through

on:
  push:
    branches:
      - era-one-block-no-import-readthrough-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-read-only-view:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Pin exact source and witness boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mathgraph-evidence
          gofmt -w core/rawdb/mathgraph_era_noimport_readthrough_test.go
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            go version
            sha256sum core/rawdb/mathgraph_era_noimport_readthrough_test.go core/rawdb/mathgraph_era_certified_materialization_test.go
            echo 'No production changes; no upstream PR or maintainer contact.'
            echo 'Witness pinned to Sepolia ERA fixture, NOT independently authorized canonical history.'
          } | tee mathgraph-evidence/manifest.txt
      - name: Verify read-only canonical access without import
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb -run '^TestMathGraphEraNoImport(CanonicalReadThrough|RejectsUntrustedWitnesses)$' -count=10 -v | tee mathgraph-evidence/noimport.txt
          grep -q 'VERIFIED_ERA_NO_IMPORT_READ_THROUGH' mathgraph-evidence/noimport.txt
          grep -q 'UNVERIFIED_ERA_READ_THROUGH_DENIED' mathgraph-evidence/noimport.txt
      - name: Qualify under race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./core/rawdb -run '^TestMathGraphEraNoImport(CanonicalReadThrough|RejectsUntrustedWitnesses)$' -count=3 | tee mathgraph-evidence/race.txt
      - name: Retain witness materialization and source-reader checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb -run '^TestMathGraph(VerifiedEra|FreshEraUnindexedBoundary|EraWitnessProbe)' -count=1 -v | tee mathgraph-evidence/ancestors.txt
      - name: Full rawdb and eradb suites
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb ./core/rawdb/eradb -count=1 | tee mathgraph-evidence/packages.txt
      - name: Upload only to Metalogic fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-era-readthrough-without-import
          path: mathgraph-evidence/
          if-no-files-found: error
