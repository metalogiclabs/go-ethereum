name: Metalogic SnapV2 Fault Injection

on:
  push:
    branches:
      - snapv2-fault-injection
  workflow_dispatch:

jobs:
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Run durable-boundary fault test
        run: go test ./eth/protocols/snap -run '^TestCatchUpWriteFailureDoesNotAdvancePivot$' -count=1 -v
