name: Native Storage Commit Boundary

on:
  push:
    branches:
      - ethdb-native-wal-error-boundary-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Go formatting
        run: |
          gofmt -d ethdb/leveldb/native_wal_ambiguity_test.go ethdb/pebble/native_precommit_error_test.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: LevelDB journal return-error and replay
        run: go test ./ethdb/leveldb -run '^TestNativeLevelDBReportedErrorAfter' -count=1 -v
      - name: Pebble pre-commit read-only control
        run: go test ./ethdb/pebble -run '^TestNativePebbleReadOnlyWriteErrorDoesNotAdvanceState$' -count=1 -v
      - name: Full LevelDB and Pebble packages
        run: go test ./ethdb/leveldb ./ethdb/pebble -count=1
      - name: Focused LevelDB race
        run: go test -race ./ethdb/leveldb -run '^TestNativeLevelDBReportedErrorAfter' -count=1
