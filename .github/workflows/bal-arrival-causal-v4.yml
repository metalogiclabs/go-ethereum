name: BAL Causal Arrival V4
on:
  push:
    branches: [bal-import-arrival-causal-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Canonical formatting
        run: |
          gofmt -d eth/downloader/downloader.go eth/downloader/queue.go eth/downloader/downloader_test.go eth/downloader/bal_import_arrival_causal_test.go | tee /tmp/fmt.diff
          test ! -s /tmp/fmt.diff
      - name: Paired causal test
        run: |
          set -o pipefail
          go test ./eth/downloader -run '^TestBALImportTimeAvailabilityCausalSeparator$' -count=1 -v -timeout=15m | tee /tmp/bal-causal.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bal-arrival-causal-v4-evidence
          path: |
            /tmp/bal-causal.log
            /tmp/fmt.diff
