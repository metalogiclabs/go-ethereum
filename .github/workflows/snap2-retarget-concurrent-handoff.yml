name: Snap2 Retarget Concurrent Handoff Qualification

on:
  push:
    branches:
      - snap2-retarget-concurrency-stress-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Check formatting
        run: |
          gofmt -d eth/downloader/pivot_retarget_handoff_test.go | tee /tmp/format.diff
          test ! -s /tmp/format.diff
      - name: Repeated real goroutine handoff
        run: go test ./eth/downloader -run '^TestSnapPivotRetargetNewStateSyncSeesCanonical$' -count=25 -v
      - name: Repeated handoff under race detector
        run: go test -race ./eth/downloader -run '^TestSnapPivotRetargetNewStateSyncSeesCanonical$' -count=10
      - name: Both package suites
        run: go test ./eth/downloader ./eth/protocols/snap -count=1
