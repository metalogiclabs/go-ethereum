name: MathGraph Certified Single ERA Block Read Through

on:
  push:
    branches:
      - era-single-block-certified-materialization-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-one-block:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Seal witness and certify formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mathgraph-evidence
          {
            printf 'exact-commit=%s\n' "$(git rev-parse HEAD)"
            go version
            echo 'Trust boundary: explicitly pinned fixture hash and SHA-256 body/receipt digests; not consensus chain finality'
          } | tee mathgraph-evidence/manifest.txt
          gofmt -w core/rawdb/mathgraph_era_certified_materialization_test.go core/rawdb/mathgraph_era_witness_probe_test.go
          sha256sum core/rawdb/mathgraph_era_certified_materialization_test.go core/rawdb/mathgraph_era_witness_probe_test.go | tee mathgraph-evidence/fixture-hashes.txt
          echo 'Only test and workflow files were added in this research branch.' | tee -a mathgraph-evidence/manifest.txt
      - name: Baseline fresh-index absence and pinned witness positive controls
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb -run '^TestMathGraph(FreshEraUnindexedBoundary|EraWitnessProbe)$' -count=2 -v | tee mathgraph-evidence/original-boundary.txt
      - name: Real indexed read through and guarded rejection of mismatched history
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb -run '^TestMathGraphVerifiedEra(SingleBlockReadThrough|BoundaryRejectsUntrustedHistory)$' -count=5 -v | tee mathgraph-evidence/verified-read-through.txt
          grep -q 'VERIFIED_SINGLE_ERA_BLOCK_READ_THROUGH' mathgraph-evidence/verified-read-through.txt
          grep -q 'UNTRUSTED_ERA_HISTORY_REJECTED' mathgraph-evidence/verified-read-through.txt
      - name: Race detector on exact integration experiment
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./core/rawdb -run '^TestMathGraphVerifiedEra(SingleBlockReadThrough|BoundaryRejectsUntrustedHistory)$' -count=2 | tee mathgraph-evidence/race.txt
      - name: Existing rawdb and ERA source package suites
        shell: bash
        run: |
          set -euo pipefail
          go test ./core/rawdb ./core/rawdb/eradb -count=1 | tee mathgraph-evidence/packages.txt
      - name: Upload evidence only to Metalogic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-certified-single-era-block
          path: mathgraph-evidence/
          if-no-files-found: error
