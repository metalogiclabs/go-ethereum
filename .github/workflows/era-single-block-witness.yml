name: MathGraph ERA Single Block Witness Probe

on:
  push:
    branches:
      - era-single-block-witness-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Emit source identity and archive witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mathgraph-evidence
          printf 'commit=%s\n' "$(git rev-parse HEAD)" | tee mathgraph-evidence/manifest.txt
          gofmt -w core/rawdb/mathgraph_era_witness_probe_test.go
          go test ./core/rawdb -run '^TestMathGraphEraWitnessProbe$' -count=1 -v | tee mathgraph-evidence/witness.txt
          grep -q '^    mathgraph_era_witness_probe_test.go:.*WITNESS number=175881' mathgraph-evidence/witness.txt
      - name: Upload witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-era-single-block-witness
          path: mathgraph-evidence/
          if-no-files-found: error
