name: Snap2 Crash Qualification

on:
  push:
    branches:
      - snap2-crash-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Run Snap/2 crash qualification
        run: go test ./eth/protocols/snap -run '^TestSnapV2CatchUpCrashAtomicity$' -count=1 -v
