name: Snap2 Candidate Qualification

on:
  push:
    branches:
      - snap2-crash-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1e613cb83b95ff756403007b3f9254b9af8ad09
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Check formatting
        run: |
          gofmt -d eth/protocols/snap/syncv2.go eth/protocols/snap/syncv2_commit_test.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: Run regression
        run: go test ./eth/protocols/snap -run TestCatchUpCommittedWriteErrorPreservesJournal -count=1 -v
      - name: Run full snap package
        run: go test ./eth/protocols/snap -count=1
