name: BAL V20 Authenticated Engine Concurrency (Fork Only)
on:
  push:
    branches:
      - bal-engine-concurrent-v20
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Pin exact official Geth source
        run: |
          set -euo pipefail
          git config user.name "Metalogic CI"
          git config user.email "ci@mathgraph.org"
          git fetch --no-tags https://github.com/ethereum/go-ethereum.git 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c
          git merge --no-edit FETCH_HEAD
          echo "MG_BAL_V20_MERGED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run authenticated serial and concurrent FCU schedules
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v20"
          gofmt -w eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go
          test -z "$(gofmt -l eth/catalyst/bal_pending_engine_witness_v13_test.go eth/catalyst/bal_engine_concurrent_v20_test.go)"
          set +e
          go test -tags balexperiment ./eth/catalyst -run '^TestBALV20(SerialInvalidFCUClearsPending|ConcurrentLateAdmissionDoesNotRestoreInvalidatedPending)$' -count=1 -v -timeout=35m 2>&1 | tee "$RUNNER_TEMP/v20/tests.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$RUNNER_TEMP/v20/go_test_exit.txt"
          if ! grep -q 'MG_BAL_V20_SERIAL_CONTROL_PASS authenticated_valid_then_invalid_clear' "$RUNNER_TEMP/v20/tests.log"; then
            echo "V20_RESULT=UNKNOWN;reason=missing_serial_positive_control" | tee "$RUNNER_TEMP/v20/boundary.txt"
            exit 1
          fi
          if [ "$result" -ne 0 ] &&
             grep -q 'MG_BAL_V20_ORDER first_authenticated_fcu_waiting_before_admission' "$RUNNER_TEMP/v20/tests.log" &&
             grep -q 'MG_BAL_V20_ORDER second_authenticated_fcu_completed_invalidated_empty_witness' "$RUNNER_TEMP/v20/tests.log" &&
             grep -q 'MG_BAL_V20_OBSTRUCTION STALE_FCU_REINSTALLED_PENDING_WITNESS' "$RUNNER_TEMP/v20/tests.log"; then
            echo "V20_RESULT=NAMED_OBSTRUCTION;scope=fork_only_authenticated_two_client_invalid_supersession;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/v20/boundary.txt"
          elif [ "$result" -eq 0 ] &&
               grep -q 'MG_BAL_V20_CONCURRENT_CONTROL_PASS pending_empty_after_older_fcu_completed' "$RUNNER_TEMP/v20/tests.log"; then
            echo "V20_RESULT=BOUNDED_SAFE;scope=fork_only_authenticated_two_client_invalid_supersession;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/v20/boundary.txt"
          else
            echo "V20_RESULT=UNKNOWN;reason=setup_failure_or_unclassified_regression;general_concurrent_fcu=UNKNOWN" | tee "$RUNNER_TEMP/v20/boundary.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bal-v20-concurrency-evidence
          path: ${{ runner.temp }}/v20/
          if-no-files-found: ignore
