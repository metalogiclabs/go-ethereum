name: BAL Checkpoint Window Qualification

on:
  push:
    branches:
      - bal-finality-checkpoint-window-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Go formatting
        run: |
          gofmt -d core/blockchain.go core/bal_apply.go core/bal_finality_window.go core/bal_finality_window_test.go core/bal_finality_window_bench_test.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: Fork, finality, cache and reconstruction regressions
        run: |
          go test ./core -run '^(TestBALFinalityWindow|TestBALReconstruction|TestInsertChainReconstructsFinalizedState|TestInsertChainExecutesWhenReconstructionDisabled|TestProcessBlockFromAccessListRejectsWrongState|TestApplyBlockAccessList)' -count=1 -v
      - name: Full core suite
        run: go test ./core -count=1
      - name: Focused race suite
        run: go test -race ./core -run '^TestBALFinalityWindow' -count=1
      - name: Paired checkpoint benchmark
        run: go test ./core -run '^$' -bench '^BenchmarkBALFinalityCheckpointWindow$' -benchtime=3x -count=1 -benchmem
