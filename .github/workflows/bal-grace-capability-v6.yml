name: Ethereum BAL Grace Capability V6 Qualification

on:
  push:
    branches:
      - bal-grace-policy-capability-v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-bounded-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact official post-35930 ancestor in disposable checkout
        run: |
          git config user.name "Metalogic Research CI"
          git config user.email "ci@mathgraph.org"
          git fetch --no-tags https://github.com/ethereum/go-ethereum.git 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c
          git merge --no-edit FETCH_HEAD
          git merge-base --is-ancestor 3a6c2e3b35ef8caa3d39dcbea3fe9f09099cca8c HEAD
          echo "MG_BAL_V6_MERGED_COMMIT=$(git rev-parse HEAD)"
          echo "MG_BAL_V6_MERGED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Frozen source format and SHA pins
        run: |
          gofmt -d eth/downloader/queue.go eth/downloader/resultstore.go eth/downloader/bal_grace_policy_test.go | tee /tmp/bal-v6-format.diff
          test ! -s /tmp/bal-v6-format.diff
          sha256sum eth/downloader/queue.go eth/downloader/resultstore.go eth/downloader/bal_grace_policy_test.go
      - name: Protected source finality and causal predecessor
        run: |
          go test ./core -run '^(TestBALFinalityMultiwindowInsertChain|TestBALReconstructionFinalityForkImport|TestBALReconstructionRejectsBrokenSkeletonChain)$' -count=1
          go test ./eth/downloader -run '^TestBALImportTimeAvailabilityCausalSeparator$' -count=1 -timeout=15m
      - name: Resource-capped policy main and global budget controls
        run: |
          set -o pipefail
          go test ./eth/downloader -run '^TestBALBoundedGrace' -count=3 -v -timeout=20m | tee /tmp/bal-v6-policy.log
          grep 'MG_BAL_GRACE_ARM' /tmp/bal-v6-policy.log > /tmp/bal-v6-arms.txt
          grep 'MG_BAL_GRACE_GLOBAL_BUDGET' /tmp/bal-v6-policy.log > /tmp/bal-v6-budget.txt
          test "$(wc -l < /tmp/bal-v6-arms.txt)" -eq 15
          test "$(wc -l < /tmp/bal-v6-budget.txt)" -eq 3
          grep 'MG_BAL_GRACE_VERDICT' /tmp/bal-v6-policy.log
      - name: Focused race test
        run: |
          go test -race ./eth/downloader -run '^TestBALBoundedGrace' -count=1 -timeout=20m
      - name: Preserved legacy and TCP integration
        run: |
          go test ./eth -run '^(TestBALDownloaderLegacyPeerForcesFallback|TestBALRealLoopbackTCPDownloaderPaired)$' -count=1 -timeout=15m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ethereum-bal-grace-capability-v6-evidence
          path: |
            /tmp/bal-v6-policy.log
            /tmp/bal-v6-arms.txt
            /tmp/bal-v6-budget.txt
            /tmp/bal-v6-format.diff
          if-no-files-found: ignore
